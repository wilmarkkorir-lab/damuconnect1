<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DamuConnect — Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <style>
        body { background: #b71c1c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 12px; }
    </style>
</head>
<body>
<div class="card shadow p-4" style="width: 400px;">
    <h3 class="text-center mb-1"><span style="color:#b71c1c;">&#128167; DamuConnect</span></h3>
    <p class="text-center text-muted mb-4">Create Account</p>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus value="{{ request.POST.username }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required value="{{ request.POST.email }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="text" name="phone" class="form-control" required value="{{ request.POST.phone }}">
        </div>
        <div class="mb-3">
            <label class="form-label">Password <small class="text-muted">(min 8 characters)</small></label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Role</label>
            <select name="role" class="form-select" required>
                <option value="" disabled selected>Select role</option>
                <option value="entity" {% if request.POST.role == 'entity' %}selected{% endif %}>Entity (Hospital / Blood Bank)</option>
                <option value="donor" {% if request.POST.role == 'donor' %}selected{% endif %}>Donor</option>
            </select>
        </div>
        <button type="submit" class="btn w-100 text-white" style="background:#b71c1c;">Create Account</button>
    </form>
    <p class="text-center mt-3 mb-0">Already have an account? <a href="{% url 'dashboard-login' %}">Login</a></p>
</div>
</body>
</html>
