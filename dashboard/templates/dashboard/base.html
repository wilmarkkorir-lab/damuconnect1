<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DamuConnect — {% block title %}Dashboard{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body { background: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #b71c1c; }
        .sidebar a { color: #fff; text-decoration: none; display: block; padding: 10px 20px; }
        .sidebar a:hover { background: #7f0000; }
        .sidebar .brand { font-size: 1.4rem; font-weight: bold; padding: 20px; border-bottom: 1px solid #e57373; }
        .badge-pending { background: #ff9800; }
        .badge-approved { background: #4caf50; }
        .badge-rejected { background: #f44336; }
    </style>
</head>
<body>
<div class="d-flex">
    <div class="sidebar col-2">
        <div class="brand text-white"><i class="bi bi-droplet-fill"></i> DamuConnect</div>
        {% block sidebar %}{% endblock %}
        <a href="{% url 'dashboard-logout' %}" class="mt-3"><i class="bi bi-box-arrow-left"></i> Logout</a>
    </div>
    <div class="col-10 p-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">{{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz" crossorigin="anonymous"></script>
</body>
</html>
