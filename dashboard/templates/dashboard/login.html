<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DamuConnect — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #b71c1c; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { border-radius: 12px; }
    </style>
</head>
<body>
<div class="card shadow p-4" style="width: 380px;">
    <h3 class="text-center mb-1"><span style="color:#b71c1c;">&#128167; DamuConnect</span></h3>
    <p class="text-center text-muted mb-4">Blood Donation Management</p>
    {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn w-100 text-white" style="background:#b71c1c;">Login</button>
    </form>
</div>
</body>
</html>
